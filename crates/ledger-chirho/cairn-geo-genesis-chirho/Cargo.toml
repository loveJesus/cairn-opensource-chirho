# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
license = "AGPL-3.0-only"
name = "cairn-geo-genesis-chirho"
version = "0.1.0"
edition = "2021"

# Operator-only geo-genesis vocabulary + wire law (8.2a) plus the signer boundary: plan author,
# custody-pinned verify, dual-key trust split, custody non-equivalence, and the acceptance pure
# verifier (8.2b), plus the durable one-time fork-impossible intent guard (8.2c). Depends inward on the
# one-root money crate and the durable filesystem primitives; no serve/http/runtime edge. The
# source-census guard for these properties lives in cairn-source-scan-chirho. ed25519-dalek rand_core is feature-unified workspace-wide by sibling crates;
# this crate signs with EXISTING keys only and calls no key generator (no generation call site, no RNG in scope; never-generate is enforced by the 8.2c source-census guard, not by compile-time gating, since ed25519-dalek rand_core is feature-unified workspace-wide).
[dependencies]
blake3 = "1"
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-ledger-regenesis-chirho = { path = "../cairn-ledger-regenesis-chirho" }
cairn-tenant-chirho = { path = "../../support-chirho/cairn-tenant-chirho" }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
