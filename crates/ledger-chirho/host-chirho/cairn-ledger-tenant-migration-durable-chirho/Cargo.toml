# For God so loved the world, that He gave His only Begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-ledger-tenant-migration-durable-chirho"
version = "0.1.0"
edition = "2021"
description = "Node-control-signed durable source-fence coordinator for tenant ledger migration."
license = "AGPL-3.0-only"
[features]
test-hooks-chirho = []

[dependencies]
anyhow = "1"
blake3 = "1"
cairn-ledger-host-storage-chirho = { path = "../cairn-ledger-host-storage-chirho" }
cairn-ledger-log-chirho = { path = "../../cairn-ledger-log-chirho" }
cairn-ledger-model-chirho = { path = "../../cairn-ledger-model-chirho" }
cairn-ledger-tenant-migration-chirho = { path = "../cairn-ledger-tenant-migration-chirho" }
cairn-ledger-tenant-migration-local-fence-chirho = { path = "../cairn-ledger-tenant-migration-local-fence-chirho" }
cairn-tenant-chirho = { path = "../../../support-chirho/cairn-tenant-chirho" }
cairn-writer-elector-chirho = { path = "../../../support-chirho/cairn-writer-elector-chirho" }
cairn-writer-head-chirho = { path = "../../../support-chirho/cairn-writer-head-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cairn-ledger-sim-chirho = { path = "../../cairn-ledger-sim-chirho" }
raft = { version = "0.7.0", default-features = false, features = ["prost-codec"] }
