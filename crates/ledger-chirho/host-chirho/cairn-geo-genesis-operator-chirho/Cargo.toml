# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
license = "AGPL-3.0-only"
name = "cairn-geo-genesis-operator-chirho"
version = "0.1.0"
edition = "2021"
description = "Read-only geo-genesis operator checks: verify a plan and a dry-run packet; it names no door that mutates a root or makes a key."

[[bin]]
name = "cairn-geo-genesis-operator-chirho"
path = "src/main.rs"

[build-dependencies]
# Build-script half only, as in the test-kind crate.
cairn-build-identity-chirho = { path = "../../../support-chirho/cairn-build-identity-chirho", features = [
    "build-script-chirho",
] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cairn-build-identity-chirho = { path = "../../../support-chirho/cairn-build-identity-chirho" }
cairn-durable-chirho = { path = "../../../support-chirho/cairn-durable-chirho" }
cairn-geo-genesis-chirho = { path = "../../cairn-geo-genesis-chirho" }
cairn-ledger-regenesis-chirho = { path = "../../cairn-ledger-regenesis-chirho" }
