# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
license = "AGPL-3.0-only"
name = "cairn-ledger-composition-chirho"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde_json = "1"
# NEW EDGE (B3b): composition -> host, the composition-root direction. Only this crate links both
# the audit derivation and the checker, so only this crate can supply the converger's signed
# conservation snapshot adapter. Acyclic: host depends leafward and never on this crate.
cairn-ledger-host-chirho = { path = "../cairn-ledger-host-chirho" }
cairn-ledger-log-chirho = { path = "../cairn-ledger-log-chirho" }
cairn-ledger-model-chirho = { path = "../cairn-ledger-model-chirho" }
cairn-ledger-read-model-chirho = { path = "../cairn-ledger-read-model-chirho" }
# The #5298 wiring split: audit DERIVES the conservation snapshot, the monitor CHECKS it, and
# only this composition crate links both (the checker itself stays journal-free and audit-free).
cairn-ledger-money-audit-chirho = { path = "../cairn-ledger-money-audit-chirho" }
cairn-ledger-conservation-monitor-chirho = { path = "../cairn-ledger-conservation-monitor-chirho" }

[dev-dependencies]
cairn-chain-core-chirho = { path = "../cairn-chain-core-chirho" }
cairn-model-privacy-chirho = { path = "../../domain-chirho/cairn-model-privacy-chirho" }
