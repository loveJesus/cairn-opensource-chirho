# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "cairn-ledger-model-chirho"
version = "0.1.0"
edition = "2021"
description = "Pure ledger DTOs — record shapes and log identities with zero I/O (Ledger Brick 2)."
license = "AGPL-3.0-only"
[lib]
name = "cairn_ledger_model_chirho"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
# The canonical wire codec (`wire_chirho`, J0a byte-law) serializes in the lib itself — the exact
# serializer is an OPERATIONAL pin (Cargo.lock); golden vectors gate any upgrade (§11.6).
serde_json = "1"
