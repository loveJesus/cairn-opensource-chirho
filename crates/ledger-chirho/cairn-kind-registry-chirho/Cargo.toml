# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "cairn-kind-registry-chirho"
version = "0.1.0"
edition = "2021"
description = "The signed append-only asset-kind registry log — records, wire, chain, projection (CF1 deliverable)."
license = "AGPL-3.0-only"
[lib]
name = "cairn_kind_registry_chirho"
path = "src/lib.rs"

[dependencies]
cairn-chain-core-chirho = { path = "../cairn-chain-core-chirho" }
anyhow = "1.0.102"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cairn-ledger-model-chirho = { path = "../cairn-ledger-model-chirho" }
cairn-ledger-log-chirho = { path = "../cairn-ledger-log-chirho" }
