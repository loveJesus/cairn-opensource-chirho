# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)

[package]
name = "cairn-ledger-geo-node-chirho"
version = "0.1.0"
edition = "2021"
description = "Geo-voter serving, write relay, and held-ledger coordination over one durable election node."
license = "AGPL-3.0-only"
[features]
default = []
# Only the separate test-kind package enables this explicit legacy-drill admission.
testkind-roster-wide-admission-chirho = []

[build-dependencies]
# Build-script half only (see the crate's own note on why the two halves are separated).
cairn-build-identity-chirho = { path = "../../support-chirho/cairn-build-identity-chirho", features = [
    "build-script-chirho",
] }

[dependencies]
anyhow = "1"
axum = "0.7"
blake3 = "1"
# The `--version` surface: a staged binary must be able to name its own tree.
cairn-build-identity-chirho = { path = "../../support-chirho/cairn-build-identity-chirho" }
cairn-config-chirho = { path = "../../support-chirho/cairn-config-chirho" }
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-ledger-host-chirho = { path = "../cairn-ledger-host-chirho" }
cairn-ledger-log-chirho = { path = "../cairn-ledger-log-chirho" }
cairn-ledger-mirror-http-chirho = { path = "../../stores-chirho/cairn-ledger-mirror-http-chirho" }
cairn-ledger-tenant-migration-chirho = { path = "../host-chirho/cairn-ledger-tenant-migration-chirho" }
cairn-roster-config-chirho = { path = "../../stores-chirho/cairn-roster-config-chirho" }
cairn-serve-runtime-chirho = { path = "../../cairn-serve-runtime-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }
cairn-tenant-chirho = { path = "../../support-chirho/cairn-tenant-chirho" }
cairn-tenant-placement-authority-chirho = { path = "../../stores-chirho/cairn-tenant-placement-authority-chirho" }
cairn-write-relay-chirho = { path = "../../support-chirho/cairn-write-relay-chirho" }
cairn-write-relay-http-chirho = { path = "../../stores-chirho/cairn-write-relay-http-chirho" }
cairn-writer-elector-chirho = { path = "../../support-chirho/cairn-writer-elector-chirho" }
cairn-writer-elector-http-chirho = { path = "../../stores-chirho/cairn-writer-elector-http-chirho" }
cairn-writer-head-chirho = { path = "../../support-chirho/cairn-writer-head-chirho" }
ctrlc = { version = "3.4", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
ureq = "2"
url = "2"

[dev-dependencies]
base64 = "0.22"
# Reverse (geo-node -> layout) dev-only edge so the drift-guard can drive 6.5-b's recomposed
# bindings beside the geo originals. The layout crate does NOT depend on the geo node, so this adds
# no cycle and never links the serve stack into the layout crate.
cairn-drill-root-layout-chirho = { path = "../cairn-drill-root-layout-chirho" }
cairn-kind-registry-chirho = { path = "../cairn-kind-registry-chirho" }
cairn-ledger-model-chirho = { path = "../cairn-ledger-model-chirho" }
cairn-ledger-read-model-chirho = { path = "../cairn-ledger-read-model-chirho" }
cairn-placement-chirho = { path = "../../domain-chirho/cairn-placement-chirho" }
cairn-roster-author-chirho = { path = "../../authoring-chirho/cairn-roster-author-chirho" }
cairn-secret-chirho = { path = "../../support-chirho/cairn-secret-chirho" }
cairn-tenant-placement-author-chirho = { path = "../../authoring-chirho/cairn-tenant-placement-author-chirho" }
ed25519-dalek = "2"
tempfile = "3"
