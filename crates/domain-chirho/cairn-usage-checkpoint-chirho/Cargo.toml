# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "cairn-usage-checkpoint-chirho"
version = "0.1.0"
edition = "2021"
description = "Pure O(window) usage-checkpoint aggregate core (fold/prune/serde) for cairn-chirho resource metering."
license = "AGPL-3.0-only"
[lib]
name = "cairn_usage_checkpoint_chirho"
path = "src/lib.rs"

[features]
default = []
test-hooks-chirho = []

[dependencies]
anyhow = "1.0.102"
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-model-economic-chirho = { path = "../cairn-model-economic-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
