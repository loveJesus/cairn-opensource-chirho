# For God so loved the world, that He gave His only Begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-query-chirho"
version = "0.1.0"
edition = "2021"
description = "SQLite read-model query helpers for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_query_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
cairn-store-redb-chirho = { path = "../stores-chirho/cairn-store-redb-chirho" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
cairn-store-redb-chirho = { path = "../stores-chirho/cairn-store-redb-chirho", features = ["test-hooks-chirho"] }
