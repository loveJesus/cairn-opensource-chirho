# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-learner-handover-chirho"
version = "0.1.0"
edition = "2021"
description = "Fixture-only learner handover evidence drill for cairn-chirho steward training."
license = "AGPL-3.0-only"
[lib]
name = "cairn_learner_handover_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
cairn-chirho = { path = "../../..", features = ["prototype-full-chirho"] }
cairn-operator-smoke-chirho = { path = "../cairn-operator-smoke-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
