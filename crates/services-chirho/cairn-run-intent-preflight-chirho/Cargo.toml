# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "cairn-run-intent-preflight-chirho"
version = "0.1.0"
edition = "2021"
description = "Read-only run-intent startup recovery preflight report for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_run_intent_preflight_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
cairn-chirho = { path = "../../.." }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Test-only: the crypto primitives moved out of cairn_chirho::effect_chirho, and a DEV
# dependency is the narrow form -- production code in this crate cannot reach the signer at
# all, which the compiler enforces. Both call sites are #[cfg(test)]-mounted.
cairn-signer-chirho = { path = "../../../crates/support-chirho/cairn-signer-chirho" }
