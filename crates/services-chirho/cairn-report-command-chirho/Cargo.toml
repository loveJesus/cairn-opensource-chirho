# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-report-command-chirho"
version = "0.1.0"
edition = "2021"
description = "Report command-body helpers for cairn-chirho CLI shells."
license = "AGPL-3.0-only"
[dependencies]
cairn-chirho = { path = "../../.." }
cairn-learner-handover-chirho = { path = "../cairn-learner-handover-chirho" }
cairn-operator-smoke-chirho = { path = "../cairn-operator-smoke-chirho" }
cairn-seqlog-scan-chirho = { path = "../../support-chirho/cairn-seqlog-scan-chirho" }
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
