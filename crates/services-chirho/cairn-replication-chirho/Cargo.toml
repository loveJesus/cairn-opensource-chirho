# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-replication-chirho"
version = "0.1.0"
edition = "2021"
description = "P3 read-only network replication: a pull-based ReplicationSourceChirho port plus a receiver that hash-verifies, length-witnesses, independently folds, and quarantines — with zero write authority by construction (no ref/head mutation deps)."
license = "AGPL-3.0-only"
[lib]
name = "cairn_replication_chirho"
path = "src/lib.rs"

[dependencies]
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-model-gate1-chirho = { path = "../../domain-chirho/cairn-model-gate1-chirho" }
cairn-projection-chirho = { path = "../../cairn-projection-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-store-fs-chirho = { path = "../../stores-chirho/cairn-store-fs-chirho" }
anyhow = "1.0.102"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cairn-store-memory-chirho = { path = "../../stores-chirho/cairn-store-memory-chirho" }
