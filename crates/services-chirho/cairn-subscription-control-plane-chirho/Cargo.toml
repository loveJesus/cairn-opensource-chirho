# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "cairn-subscription-control-plane-chirho"
version = "0.1.0"
edition = "2021"
description = "Read-only verified current-control-plane witness for Cairn Subscribe."
license = "AGPL-3.0-only"
[lib]
name = "cairn_subscription_control_plane_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
cairn-chirho = { path = "../../.." }
cairn-gate1-authority-log-chirho = { path = "../cairn-gate1-authority-log-chirho" }
cairn-model-gate1-chirho = { path = "../../domain-chirho/cairn-model-gate1-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }
cairn-subscribe-chirho = { path = "../cairn-subscribe-chirho" }
constant_time_eq = "=0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cairn-writer-head-chirho = { path = "../../support-chirho/cairn-writer-head-chirho" }
