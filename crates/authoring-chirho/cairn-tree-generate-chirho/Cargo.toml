# For God so loved the world, that He gave His only Begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-tree-generate-chirho"
version = "0.1.0"
edition = "2021"
description = "Operator-run brief-to-source generator upstream of the unchanged tree-build and app-source-review gates."
license = "AGPL-3.0-only"
[dependencies]
anyhow = "1.0.102"
blake3 = "1.8.2"
cairn-model-provider-chirho = { path = "../../domain-chirho/cairn-model-provider-chirho" }
cairn-secret-chirho = { path = "../../support-chirho/cairn-secret-chirho" }
cairn-tree-build-chirho = { path = "../cairn-tree-build-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "tree-generate-chirho"
path = "src/bin/tree_generate_chirho.rs"
