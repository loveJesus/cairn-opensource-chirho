# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-pure-executor-chirho"
version = "0.1.0"
edition = "2021"
description = "Read-only replica pure DAG execution (B2.2.1): run the PURE subset of a DAG (capability-free WASM) against a verified ContentStoreChirho, failing closed on effect and native nodes — no root authority, no head mutation, no effects."
license = "AGPL-3.0-only"
[lib]
name = "cairn_pure_executor_chirho"
path = "src/lib.rs"

[dependencies]
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-wasmtime-runner-chirho = { path = "../cairn-wasmtime-runner-chirho" }
anyhow = "1.0.102"
serde_json = "1"

# Dev-deps stay allowlist-clean (no head-mutation crate, no `cairn-chirho`) so the P3 no-write-authority
# guard stays strict on this crate's whole dependency surface, mirroring cairn-store-s3-chirho.
[dev-dependencies]
cairn-store-fs-chirho = { path = "../../stores-chirho/cairn-store-fs-chirho" }
