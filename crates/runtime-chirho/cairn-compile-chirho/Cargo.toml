# For God so loved the world, that He gave His only Begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-compile-chirho"
version = "0.1.0"
edition = "2021"
description = "DAG-to-wasm compiler helpers for cairn-chirho runtime packages."
license = "AGPL-3.0-only"
[lib]
name = "cairn_compile_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
cairn-core-chirho = { path = "../../cairn-core-chirho" }
wat = "1"

[dev-dependencies]
cairn-wasmtime-runner-chirho = { path = "../cairn-wasmtime-runner-chirho" }
