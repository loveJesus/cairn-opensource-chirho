# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)

[package]
name = "cairn-effect-commit-chirho"
version = "0.1.0"
edition = "2021"
description = "Canonical signed effect intents and bounded effect-commit coordination for Cairn."
license = "AGPL-3.0-only"
[lib]
name = "cairn_effect_commit_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
cairn-ledger-model-chirho = { path = "../../ledger-chirho/cairn-ledger-model-chirho" }
cairn-undo-plan-chirho = { path = "../cairn-undo-plan-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
