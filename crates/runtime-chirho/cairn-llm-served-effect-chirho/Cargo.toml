# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)

[package]
name = "cairn-llm-served-effect-chirho"
version = "0.1.0"
edition = "2021"
description = "Served spend-bounded LLM effect: provider port, deterministic stub, and plaintext-free evidence types for Cairn."
license = "AGPL-3.0-only"
[lib]
name = "cairn_llm_served_effect_chirho"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
anyhow = "1"
