# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "cairn-app-docs-chirho"
version = "0.1.0"
edition = "2021"
description = "Per-app API descriptor DTOs plus their pure Markdown and MCP-tool-manifest generators for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_app_docs_chirho"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
cairn-capability-chirho = { path = "../../support-chirho/cairn-capability-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cairn-core-chirho = { path = "../../cairn-core-chirho" }
