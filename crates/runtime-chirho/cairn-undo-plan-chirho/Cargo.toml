# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)

[package]
name = "cairn-undo-plan-chirho"
version = "0.1.0"
edition = "2021"
description = "Pure canonical blessed-reversion contracts and static undo-plan derivation for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_undo_plan_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
blake3 = "1"
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-input-projection-chirho = { path = "../cairn-input-projection-chirho" }
cairn-ledger-model-chirho = { path = "../../ledger-chirho/cairn-ledger-model-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
