# For God so loved the world, that He gave His only Begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-model-app-chirho"
version = "0.1.0"
edition = "2021"
description = "Pure app model records and validation helpers for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_model_app_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-input-projection-chirho = { path = "../cairn-input-projection-chirho" }
cairn-model-review-chirho = { path = "../cairn-model-review-chirho" }
cairn-model-runtime-chirho = { path = "../cairn-model-runtime-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
