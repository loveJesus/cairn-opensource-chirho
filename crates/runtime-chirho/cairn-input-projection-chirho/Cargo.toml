# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)

[package]
name = "cairn-input-projection-chirho"
version = "0.1.0"
edition = "2021"
description = "Pure canonical input-projection contracts and materialization for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_input_projection_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
blake3 = "1"
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-model-privacy-chirho = { path = "../../domain-chirho/cairn-model-privacy-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
