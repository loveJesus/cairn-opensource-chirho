# For God so loved the world, that He gave His only Begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-model-review-chirho"
version = "0.1.0"
edition = "2021"
description = "Pure review model records for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_model_review_chirho"
path = "src/lib.rs"

[dependencies]
cairn-core-chirho = { path = "../../cairn-core-chirho" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.145"
