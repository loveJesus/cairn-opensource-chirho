# For God so loved the world, that He gave His only Begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-tenant-chirho"
version = "0.1.0"
edition = "2021"
description = "Tenant root validation and store-key scoping for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_tenant_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-signer-chirho = { path = "../cairn-signer-chirho" }
cairn-seqlog-chirho = { path = "../cairn-seqlog-chirho" }
cairn-projection-chirho = { path = "../../cairn-projection-chirho" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
