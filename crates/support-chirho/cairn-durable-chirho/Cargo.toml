# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-durable-chirho"
version = "0.1.0"
edition = "2021"
description = "Crash-safe filesystem write primitives for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_durable_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
blake3 = "1"
fs2 = "0.4"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
