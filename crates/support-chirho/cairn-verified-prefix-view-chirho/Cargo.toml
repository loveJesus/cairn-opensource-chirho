# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-verified-prefix-view-chirho"
version = "0.1.0"
edition = "2021"
description = "Incremental, verified, in-process view of an append-only signed JSONL log, so a hot operation verifies only the records appended since the last call."
license = "AGPL-3.0-only"
[lib]
name = "cairn_verified_prefix_view_chirho"
path = "src/lib.rs"

[features]
default = []
# Test-only: join and hold the background jobs. Exactly one dev-dependency edge turns it on.
test-hooks-chirho = []
# Opt-in lifecycle observation for a dedicated component fixture, never authority or policy.
dev-lifecycle-custody-chirho = []

[dependencies]
anyhow = "1.0.102"
cairn-durable-chirho = { path = "../cairn-durable-chirho" }
