# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-write-relay-chirho"
version = "0.1.0"
edition = "2021"
description = "Transport-neutral bounded and authenticated write-relay contract; carries requests but no writer authority."
license = "AGPL-3.0-only"
[lib]
name = "cairn_write_relay_chirho"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
blake3 = "1"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
