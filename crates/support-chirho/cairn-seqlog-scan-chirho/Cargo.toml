# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-seqlog-scan-chirho"
version = "0.1.0"
edition = "2021"
description = "Read-only CLI helper for seqlog torn-tail and malformed-middle evidence scans."
license = "AGPL-3.0-only"
[lib]
name = "cairn_seqlog_scan_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
cairn-projection-chirho = { path = "../../cairn-projection-chirho" }
cairn-seqlog-chirho = { path = "../cairn-seqlog-chirho" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
