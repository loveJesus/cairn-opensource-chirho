# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-source-scan-chirho"
version = "0.1.0"
edition = "2021"
description = "Workspace source walker and balanced-tree source guards for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_source_scan_chirho"
path = "src/lib.rs"

[dependencies]
syn = { version = "=2.0.117", features = ["full", "visit"] }
toml = "=0.8.23"

[dev-dependencies]
blake3 = "1"
proc-macro2 = "=1.0.106"
serde_json = "1"
