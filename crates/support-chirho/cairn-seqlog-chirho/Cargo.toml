# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-seqlog-chirho"
version = "0.1.0"
edition = "2021"
description = "Shared fs2-locked JSONL append helpers for cairn-chirho signed evidence logs."
license = "AGPL-3.0-only"
[lib]
name = "cairn_seqlog_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
blake3 = "1"
cairn-durable-chirho = { path = "../cairn-durable-chirho" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
