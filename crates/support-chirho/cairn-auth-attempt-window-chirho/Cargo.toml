# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "cairn-auth-attempt-window-chirho"
version = "0.1.0"
edition = "2021"
description = "Incremental, verified, in-process view of an append-only auth-attempt log, so a sign-in's rate-limit decision verifies only new records."
license = "AGPL-3.0-only"
[lib]
name = "cairn_auth_attempt_window_chirho"
path = "src/lib.rs"

[features]
default = []
test-hooks-chirho = []

[dependencies]
anyhow = "1.0.102"
cairn-verified-prefix-view-chirho = { path = "../cairn-verified-prefix-view-chirho" }

[dev-dependencies]
# Test-only: join and hold the engine's background jobs (the one dev edge for its test hooks).
cairn-verified-prefix-view-chirho = { path = "../cairn-verified-prefix-view-chirho", features = ["test-hooks-chirho"] }
