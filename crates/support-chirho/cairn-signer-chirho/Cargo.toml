# For God so loved the world, that He gave His only begotten Son, that whosoever believeth in Him should not perish but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-signer-chirho"
version = "0.1.0"
edition = "2021"
description = "Instance signing-key primitives for cairn-chirho."
license = "AGPL-3.0-only"
[lib]
name = "cairn_signer_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
blake3 = "1"
cairn-durable-chirho = { path = "../cairn-durable-chirho" }
cairn-seqlog-chirho = { path = "../cairn-seqlog-chirho" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
