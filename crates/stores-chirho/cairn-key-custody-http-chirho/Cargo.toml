# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-key-custody-http-chirho"
version = "0.1.0"
edition = "2021"
description = "C5 B2: the private-blob key-custody HOLDER. A durable holder store, the two private-mesh endpoints that admit a leader's custody and erasure frames, and the client a leader uses. Keys are stored in the root's own key-file bytes beside their binding, per-subject tombstones are durable before any removal, and receipts are signed only after fsync."
license = "AGPL-3.0-only"
[lib]
name = "cairn_key_custody_http_chirho"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-key-custody-chirho = { path = "../../support-chirho/cairn-key-custody-chirho" }
cairn-mirror-chirho = { path = "../../support-chirho/cairn-mirror-chirho" }
cairn-seqlog-chirho = { path = "../../support-chirho/cairn-seqlog-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }
cairn-tenant-placement-authority-chirho = { path = "../cairn-tenant-placement-authority-chirho" }
cairn-writer-elector-chirho = { path = "../../support-chirho/cairn-writer-elector-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
ureq = "2"
zeroize = "1"

[dev-dependencies]
cairn-placement-chirho = { path = "../../domain-chirho/cairn-placement-chirho" }
ed25519-dalek = "2"
tempfile = "3"
