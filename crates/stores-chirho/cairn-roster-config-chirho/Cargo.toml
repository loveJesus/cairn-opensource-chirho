# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-roster-config-chirho"
version = "0.1.0"
edition = "2021"
description = "A2 roster-derived config: derive each node's elector config (2a) and WireGuard config (2b) from the ONE operator-signed roster. A read-only consumer of the signed roster; nodes distribute config but never author their own authority."
license = "AGPL-3.0-only"
[lib]
name = "cairn_roster_config_chirho"
path = "src/lib.rs"

[dependencies]
cairn-replication-chirho = { path = "../../services-chirho/cairn-replication-chirho" }
cairn-tenant-placement-authority-chirho = { path = "../cairn-tenant-placement-authority-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.102"
# WireGuard public-key derivation (slice 2b). Pinned to 2.0.1 so it reuses the already-locked
# curve25519-dalek 4.x; 3.0.0 requires curve25519-dalek 5.x, which would bump a workspace-wide crypto
# crate as a side effect. The public key is x25519(private, basepoint) — byte-identical to `wg pubkey`.
x25519-dalek = "2.0.1"
base64 = "0.22"
# Wipe the WG private key / secret config bytes on drop (defense-in-depth: freed heap / swap / core
# dumps). Already in the tree via the dalek crates; the `alloc` feature gives String/Vec zeroization.
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
cairn-placement-chirho = { path = "../../domain-chirho/cairn-placement-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }
tempfile = "3"
