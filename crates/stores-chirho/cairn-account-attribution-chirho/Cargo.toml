# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-account-attribution-chirho"
version = "0.1.0"
edition = "2021"
description = "The per-account attribution and freeze record of every private-blob key, written ahead of key creation, so an account's erasure can find every key it ever made."
license = "AGPL-3.0-only"
[lib]
name = "cairn_account_attribution_chirho"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-seqlog-chirho = { path = "../../support-chirho/cairn-seqlog-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }

[dev-dependencies]
tempfile = "3"
