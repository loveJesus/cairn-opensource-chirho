# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-store-s3-chirho"
version = "0.1.0"
edition = "2021"
description = "S3-compatible blob-store adapter (Ceph RGW / Garage / MinIO, path-style + SigV4) implementing the existing ContentStoreChirho and ReplicationSourceChirho ports — verify-on-read on content gets, fail-closed listing, and a push-side mirror that refuses corrupt local objects."
license = "AGPL-3.0-only"
[lib]
name = "cairn_store_s3_chirho"
path = "src/lib.rs"

[dependencies]
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-replication-chirho = { path = "../../services-chirho/cairn-replication-chirho" }
cairn-model-gate1-chirho = { path = "../../domain-chirho/cairn-model-gate1-chirho" }
# The reference binaries (root->bucket mirror / bucket replica pull) wire the localfs source +
# fs store + quarantine + durable log writes into deployable composition roots; every one of these
# crates stays allowlist-clean (no head mutation).
cairn-replication-localfs-chirho = { path = "../cairn-replication-localfs-chirho" }
cairn-store-fs-chirho = { path = "../cairn-store-fs-chirho" }
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
ureq = "2"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.102"

# Dev-deps stay allowlist-clean (no head-mutation crate, no `cairn-chirho`) so the P3 no-write-authority
# guard stays strict on this crate's whole dependency surface, mirroring cairn-replication-http-chirho.
[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
cairn-replication-http-chirho = { path = "../cairn-replication-http-chirho" }
