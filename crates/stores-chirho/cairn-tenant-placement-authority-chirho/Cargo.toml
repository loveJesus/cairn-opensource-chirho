# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-tenant-placement-authority-chirho"
version = "0.1.0"
edition = "2021"
description = "Bounded signed tenant placement authority and verification for Cairn geo groups."
license = "AGPL-3.0-only"
[lib]
name = "cairn_tenant_placement_authority_chirho"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
cairn-chain-core-chirho = { path = "../../ledger-chirho/cairn-chain-core-chirho" }
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-placement-chirho = { path = "../../domain-chirho/cairn-placement-chirho" }
cairn-seqlog-chirho = { path = "../../support-chirho/cairn-seqlog-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }
cairn-tenant-chirho = { path = "../../support-chirho/cairn-tenant-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
