# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-store-redb-chirho"
version = "0.1.0"
edition = "2021"
description = "redb AuditLog + StateStore adapter for cairn with a transactional state+audit unit-of-work."
license = "AGPL-3.0-only"
[lib]
name = "cairn_store_redb_chirho"
path = "src/lib.rs"

[dependencies]
cairn-core-chirho = { path = "../../cairn-core-chirho" }
anyhow = "1.0.102"
blake3 = "1"
redb = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
# Exposes destructive test/migration-simulation helpers (e.g. the legacy-root changelog wipe) to
# downstream crates' TESTS only — never enabled by a normal dependency.
test-hooks-chirho = []
