# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-store-fs-chirho"
version = "0.1.0"
edition = "2021"
description = "Filesystem ContentStore + AuditLog adapters for cairn — the server backend (content-addressed files + fs2-locked appends)."
license = "AGPL-3.0-only"
[lib]
name = "cairn_store_fs_chirho"
path = "src/lib.rs"

[dependencies]
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-core-chirho = { path = "../../cairn-core-chirho" }
anyhow = "1.0.102"
blake3 = "1"
fs2 = "0.4"
serde_json = "1"

[dev-dependencies]
cairn-store-memory-chirho = { path = "../cairn-store-memory-chirho" }
