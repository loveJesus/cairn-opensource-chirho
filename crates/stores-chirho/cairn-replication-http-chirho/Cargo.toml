# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
[package]
name = "cairn-replication-http-chirho"
version = "0.1.0"
edition = "2021"
description = "Real over-the-wire HTTP adapter for the P3 ReplicationSourceChirho port — an axum source server (allowlist enforced server-side, generic over the port) plus a ureq client adapter; the network transport double, with CEPH/S3 as a later storage backend behind the same port."
license = "AGPL-3.0-only"
[lib]
name = "cairn_replication_http_chirho"
path = "src/lib.rs"

[dependencies]
cairn-replication-chirho = { path = "../../services-chirho/cairn-replication-chirho" }
cairn-core-chirho = { path = "../../cairn-core-chirho" }
cairn-durable-chirho = { path = "../../support-chirho/cairn-durable-chirho" }
cairn-ledger-model-chirho = { path = "../../ledger-chirho/cairn-ledger-model-chirho" }
cairn-ledger-read-model-chirho = { path = "../../ledger-chirho/cairn-ledger-read-model-chirho" }
cairn-pure-executor-chirho = { path = "../../runtime-chirho/cairn-pure-executor-chirho" }
cairn-signer-chirho = { path = "../../support-chirho/cairn-signer-chirho" }
# The reference binaries (source server / replica pull) wire the localfs source + fs store +
# quarantine into deployable composition roots; both crates stay allowlist-clean (no head mutation).
cairn-replication-localfs-chirho = { path = "../cairn-replication-localfs-chirho" }
cairn-store-fs-chirho = { path = "../cairn-store-fs-chirho" }
wat = "1.250.0"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.102"
blake3 = "1"
url = "2"

# Dev-deps are allowlist-clean (no head-mutation crate, no `cairn-chirho`) so the P3 no-write-authority
# guard stays strict on this crate's whole dependency surface. The full-fold end-to-end (which needs
# real signed anchors from `cairn-chirho`) lives in the ROOT crate's tests instead.
[dev-dependencies]
cairn-model-gate1-chirho = { path = "../../domain-chirho/cairn-model-gate1-chirho" }
cairn-store-fs-chirho = { path = "../cairn-store-fs-chirho" }
wat = "1.250.0"
