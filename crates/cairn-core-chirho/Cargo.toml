# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "cairn-core-chirho"
version = "0.1.0"
edition = "2021"
description = "Lean, wasm-compilable foundation for cairn-chirho: model types, content hashes, typed object encoding, refs, and the storage port traits."
license = "AGPL-3.0-only"
[lib]
name = "cairn_core_chirho"
path = "src/lib.rs"

[features]
default = []
# Test-only: a thread-local reflog read counter the serve-runtime growth arms read through the real handlers.
test-hooks-chirho = []

[dependencies]
anyhow = "1.0.102"
blake3 = "1"
cairn-durable-chirho = { path = "../support-chirho/cairn-durable-chirho" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
