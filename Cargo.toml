# Landed: serde_json (object encoding), tokio + axum (HTTP serve),
# ed25519-dalek (effect signing).
# Still arriving: epoch-yield + pooling allocator.

# Fleet velocity P2 (spec-chirho/workflows-chirho/refactor-process-chirho/fleet-velocity-chirho.md):
# line-tables-only keeps backtraces resolving for OUR code while cutting the debuginfo that made
# target/ 245GB and every link ~20s; dependencies and build scripts carry no debuginfo at all.
# One-off full-debug session: CARGO_PROFILE_DEV_DEBUG=2 cargo test -p <crate>.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
debug = "line-tables-only"
