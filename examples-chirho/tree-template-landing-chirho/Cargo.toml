# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "tree-template-landing-chirho"
version = "0.1.0"
edition = "2021"
description = "A vetted business-landing TEMPLATE render — the first slice of the AI app-builder. The render is fixed, vetted code; the model later produces only the params DATA it renders from."
license = "MIT"

# Standalone app (path-depends on the cairn engine crates; built/served via the cairn tree-build + CLI).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.16.0"
cairn-node-sdk-chirho = { path = "../../crates/cairn-node-sdk-chirho", features = ["json-chirho"] }
cairn-node-templating-chirho = { path = "../../crates/authoring-chirho/cairn-node-templating-chirho" }

[[example]]
name = "render_template_landing_guest_chirho"
path = "examples/render_template_landing_guest_chirho.rs"
crate-type = ["cdylib"]
