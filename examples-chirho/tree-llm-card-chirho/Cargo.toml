# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
[package]
name = "tree-llm-card-chirho"
version = "0.1.0"
edition = "2021"
description = "a2b served-LLM card example: a JS-free form (GET) plus the pure transforms that wrap the blessed llm_chirho paid-effect door on a POST route. App code writes only pure data; the effect is the DAG's, not this crate's."
license = "MIT"

# Standalone app: path-depends on the cairn guest crates, built/served through cairn. The empty
# [workspace] table opts out of the engine workspace (cargo test --workspace never touches it).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cairn-node-sdk-chirho = { path = "../../crates/cairn-node-sdk-chirho", features = ["json-chirho"] }
cairn-node-templating-chirho = { path = "../../crates/authoring-chirho/cairn-node-templating-chirho" }

[[example]]
name = "render_form_guest_chirho"
path = "examples/render_form_guest_chirho.rs"
crate-type = ["cdylib"]

[[example]]
name = "build_llm_request_guest_chirho"
path = "examples/build_llm_request_guest_chirho.rs"
crate-type = ["cdylib"]

[[example]]
name = "render_card_guest_chirho"
path = "examples/render_card_guest_chirho.rs"
crate-type = ["cdylib"]
