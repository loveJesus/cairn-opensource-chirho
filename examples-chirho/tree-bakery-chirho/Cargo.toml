# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
[package]
name = "tree-bakery-chirho"
version = "0.1.0"
edition = "2021"
description = "Honeyhill Bakery — a fictional small-business landing page, authored AS a cairn app to prove an AI agent can build a cairn app from the conventions alone."
license = "MIT"

# Standalone app (path-depends on the cairn engine crates; built/served via the cairn tree-build + CLI).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cairn-node-sdk-chirho = { path = "../../crates/cairn-node-sdk-chirho", features = ["json-chirho"] }
cairn-node-templating-chirho = { path = "../../crates/authoring-chirho/cairn-node-templating-chirho" }

[[example]]
name = "render_home_guest_chirho"
path = "examples/render_home_guest_chirho.rs"
crate-type = ["cdylib"]
